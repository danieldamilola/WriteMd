name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        # v3 here against v4 in ci.yml meant the release path resolved a
        # different pnpm than the one CI validated against.
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Must match ci.yml. jsdom 30 needs ^22.22.2 || ^24.15.0 || >=26, so
          # the old '20' here meant `pnpm test` in the release job could fail
          # where CI had already proved the same tree green.
          node-version: '24.15.0'
          cache: pnpm

      - name: Install dependencies
        # Bare `pnpm install` let the lockfile drift on the one path that
        # publishes binaries.
        run: pnpm install --frozen-lockfile

      - name: Lint, Typecheck and Format Check
        run: |
          pnpm lint
          pnpm typecheck
          pnpm format:check

      - name: Run Tests
        run: pnpm test

      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            pnpm build:win -p always
          elif [ "$RUNNER_OS" == "macOS" ]; then
            pnpm build:mac -p always
          else
            pnpm build:linux -p always
          fi
        shell: bash
