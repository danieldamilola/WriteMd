name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint and Typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Build and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            pnpm build:win -p always
          elif [ "$RUNNER_OS" == "macOS" ]; then
            pnpm build:mac -p always
          else
            pnpm build:linux -p always
          fi
        shell: bash
