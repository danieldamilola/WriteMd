name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest exercises the app's own platform; ubuntu proves the
        # unit suite is no longer hardcoded to C:/Temp paths.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          # jsdom 30 declares engines ^22.22.2 || ^24.15.0 || >=26, and it
          # pulls in undici 8, which needs >=22.19.0. On Node 20 the suite died
          # with "webidl.util.markAsUncloneable is not a function" before a
          # single test ran. 24.15.0 is the lowest line that satisfies both.
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Was a warning inside @electron-toolkit/eslint-config-prettier, so
      # `pnpm lint` exited 0 on formatting drift and eslint skipped YAML/JSON
      # entirely. Four files were already failing this.
      - run: pnpm format:check
      - run: pnpm test

  e2e:
    # Was never run in CI at all. These specs launch the real Electron app, so
    # they need a desktop session; xvfb provides one on linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          # Makes every Electron launch fail with "bad option:
          # --remote-debugging-port=0" when it leaks into the environment.
          ELECTRON_RUN_AS_NODE: ''
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore
