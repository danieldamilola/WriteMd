<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .eyes{transform-origin:627px 653px;animation:think 3.2s ease-in-out infinite}
    .doc{animation:float 3.2s ease-in-out infinite}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;font-weight:500;font-size:104px;fill:#F2F2F2;letter-spacing:-1px}
    .d{animation:dot 1.4s ease-in-out infinite}.d2{animation-delay:.2s}.d3{animation-delay:.4s}
    @keyframes think{0%{transform:translate(0,0) scaleY(1)}12%,32%{transform:translate(-36px,-14px) scaleY(1)}46%,66%{transform:translate(36px,-14px) scaleY(1)}78%{transform:translate(0,0) scaleY(1)}86%{transform:translate(0,0) scaleY(.08)}92%,100%{transform:translate(0,0) scaleY(1)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes dot{0%,60%,100%{opacity:.2}30%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.eyes,.doc,.d{animation:none}.d{opacity:1}}
  </style>
  <defs><mask id="m" maskUnits="userSpaceOnUse" x="200" y="200" width="860" height="900">
    <rect x="200" y="200" width="860" height="900" fill="#fff"/>
    <path fill="#000" d="M730 282C755 305 770 350 780 400C790 440 800 462 840 468C880 472 915 478 928 492H795C760 492 731 465 731 430Z"/>
    <g class="eyes" fill="#000"><rect x="493" y="565" width="76" height="176" rx="38"/><rect x="686" y="565" width="76" height="176" rx="38"/></g>
  </mask></defs>
  <g transform="translate(20,24) scale(0.4) translate(-260,-220)">
    <g class="doc"><path fill="#F2F2F2" d="M432 246H690C725 246 748 258 770 278L925 455C945 478 956 495 956 520V900A130 130 0 0 1 826 1030H432A130 130 0 0 1 302 900V376A130 130 0 0 1 432 246Z" mask="url(#m)"/></g>
  </g>
  <text class="t" x="340" y="222">Thinking<tspan class="d d1">.</tspan><tspan class="d d2">.</tspan><tspan class="d d3">.</tspan></text>
</svg>
