appId: com.writemd.editor
productName: WriteMd
fileAssociations:
  - ext: md
    name: Markdown File
    description: Markdown document
    role: Editor
  - ext: markdown
    name: Markdown File
    role: Editor
  - ext: mdown
    name: Markdown File
    role: Editor
  - ext: mkd
    name: Markdown File
    role: Editor
directories:
  buildResources: build
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - THIRD_PARTY_NOTICES.md
  - licenses/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  # Resources live in build/, and directories.buildResources points there.
  # Unpacking the icon assets out of the asar is unnecessary; nothing at
  # runtime reads them from disk.
  - build/**
win:
  executableName: writemd
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: build/installer-icon.ico
  uninstallerIcon: build/uninstaller-icon.ico
  installerHeader: build/installer-header.bmp
  installerSidebar: build/installer-sidebar.bmp
mac:
  category: public.app-category.productivity
  # Uncomment with real certificates. Until then electron-updater's
  # quitAndInstall cannot install anything on macOS: Squirrel.Mac refuses
  # unsigned bundles. Requires an Apple Developer membership, a Developer ID
  # Application certificate, and an app-specific password for notarization.
  # identity: null
  # hardenedRuntime: true
  # notarize: true
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # This app requests neither camera nor microphone access. Declaring them
    # invites App Store review questions and, on recent macOS, can surface a
    # permission prompt the app never uses.
    NSDocumentsFolderUsageDescription: WriteMd opens and saves Markdown documents in your Documents folder.
    NSDownloadsFolderUsageDescription: WriteMd opens Markdown documents from your Downloads folder.
  # Unsigned until signing is configured. Gatekeeper blocks this on any Mac
  # that is not the developer's; `xattr -dr com.apple.quarantine` clears it
  # locally.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  # Resolved from package.json's repository field; named here as well so the
  # feed works even if that field is dropped.
  owner: danieldamilola
  repo: WriteMd
